name: CI Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      DATABASE_URL: sqlite+aiosqlite:///./test.db
      SYNC_DATABASE_URL: sqlite:///./test.db
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      REDIS_URL: redis://localhost:6379/0
      CERT_STORAGE_PATH: ./certificates

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: 'backend/requirements.txt'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run automated test suite
      run: |
        cd backend
        python -m pytest -v --tb=short 2>&1 | tee pytest_output.txt || touch test_failed.txt
        echo "### 🧪 Pytest Test Results" >> $GITHUB_STEP_SUMMARY
        echo '```text' >> $GITHUB_STEP_SUMMARY
        cat pytest_output.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        if [ -f test_failed.txt ]; then
          echo "Tests failed"
          exit 1
        fi
